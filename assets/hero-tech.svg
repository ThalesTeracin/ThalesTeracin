<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060915"/>
      <stop offset="55%" stop-color="#0B1330"/>
      <stop offset="100%" stop-color="#150B2E"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="roverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1E3A63" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glowSmall" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FB923C"/>
    </marker>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="338" rx="26"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="26" fill="url(#bgGrad)"/>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="1198" height="338" fill="url(#grid)" opacity="0.28"/>
    <circle cx="990" cy="95" r="190" fill="url(#glowBlue)" filter="url(#softBlur)"/>
    <circle cx="160" cy="300" r="170" fill="url(#glowPurple)" filter="url(#softBlur)"/>
    <circle cx="620" cy="40" r="120" fill="url(#glowPurple)" filter="url(#softBlur)" opacity="0.5"/>

    <g fill="#93C5FD">
      <circle cx="470" cy="55" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="90" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="45" r="1.8"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="110" r="1.5"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="270" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="60" r="1.3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Consolas, Menlo, monospace" fill="#7DD3FC" opacity="0.16">
      <text x="640" y="130" font-size="20">&lt;/&gt;</text>
      <text x="1090" y="150" font-size="18">01</text>
    </g>
    <g transform="translate(1050,190)" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="1050,190;1050,178;1050,190" dur="4.5s" repeatCount="indefinite"/>
      <rect x="-14" y="-16" width="28" height="10" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
      <rect x="-14" y="-4" width="28" height="10" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
      <rect x="-14" y="8" width="28" height="10" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
    </g>

    <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.55">
      <path d="M18 40 V18 H40"/>
      <path d="M1160 18 H1182 V40"/>
      <path d="M1182 300 V322 H1160"/>
      <path d="M40 322 H18 V300"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="26" fill="none" stroke="url(#chipGrad)" stroke-opacity="0.45" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="58" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#titleGrad)">Thales Renato Teracin</text>
  <text x="59" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#38BDF8">Cloud • AWS • IA • Desenvolvimento • Automação</text>
  <text x="59" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Construindo soluções reais com nuvem, inteligência artificial e engenharia de software.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="59" y="200" width="66" height="34" rx="17" fill="#0F1B33" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="92" y="222" text-anchor="middle" fill="#E0F2FE">AWS</text>

    <rect x="135" y="200" width="52" height="34" rx="17" fill="#0F1B33" stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="161" y="222" text-anchor="middle" fill="#EDE9FE">AI</text>

    <rect x="197" y="200" width="132" height="34" rx="17" fill="#0F1B33" stroke="#FB923C" stroke-width="1.2" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="263" y="222" text-anchor="middle" fill="#FFEDD5">Automation</text>
  </g>

  <line x1="58" y1="300" x2="1142" y2="300" stroke="#1E293B" stroke-width="2"/>
  <g fill="#38BDF8" opacity="0.7">
    <circle cx="58" cy="300" r="3"/>
    <circle cx="340" cy="300" r="3"/>
    <circle cx="622" cy="300" r="3"/>
    <circle cx="904" cy="300" r="3"/>
    <circle cx="1142" cy="300" r="3"/>
  </g>

  <path id="track" d="M 110 296 C 240 296 300 270 400 278 C 500 286 550 258 650 250 C 755 242 800 214 860 206 C 890 202 908 199 926 196" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.55"/>

  <g fill="#67E8F9">
    <circle r="3">
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4">
      <animateMotion dur="9s" begin="-1.4s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animateMotion dur="9s" begin="-2.6s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#track"/></animateMotion>
      <animate attributeName="opacity" values="0;0.55;0" dur="9s" begin="-2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#glowSmall)">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#track"/></animateMotion>
    <g transform="translate(0,-12)">
      <ellipse cx="0" cy="14" rx="20" ry="4" fill="#000" opacity="0.25"/>
      <rect x="-18" y="-6" width="36" height="16" rx="8" fill="url(#roverGrad)"/>
      <path d="M-10,-6 Q0,-20 10,-6 Z" fill="url(#roverGrad)"/>
      <rect x="-8" y="-3" width="16" height="8" rx="3" fill="#03212B" opacity="0.55"/>
      <circle cx="0" cy="-11" r="2" fill="#FFF7ED">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="2" r="2.6" fill="#F0FDFF"/>
      <g stroke="#0B1330" stroke-width="1.5">
        <line x1="0" y1="-11" x2="0" y2="-17"/>
      </g>
      <g>
        <circle cx="-11" cy="10" r="5" fill="#0B1330" stroke="#67E8F9" stroke-width="1.6">
          <animateTransform attributeName="transform" type="rotate" from="0 -11 10" to="360 -11 10" dur="0.55s" repeatCount="indefinite"/>
        </circle>
        <circle cx="11" cy="10" r="5" fill="#0B1330" stroke="#67E8F9" stroke-width="1.6">
          <animateTransform attributeName="transform" type="rotate" from="0 11 10" to="360 11 10" dur="0.55s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g transform="translate(985,92)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="5s" repeatCount="indefinite"/>
      <g filter="url(#glowSmall)">
        <circle cx="-18" cy="4" r="20" fill="url(#cloudGrad)"/>
        <circle cx="14" cy="-6" r="26" fill="url(#cloudGrad)"/>
        <circle cx="0" cy="16" r="24" fill="url(#cloudGrad)"/>
        <rect x="-34" y="4" width="68" height="26" rx="13" fill="url(#cloudGrad)"/>
      </g>
    </g>
  </g>

  <path d="M 955 128 C 935 150 928 158 940 176" fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrowHead)">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(975,196)">
    <circle r="46" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="42;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="42;70" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#glowSmall)">
      <rect x="-45" y="-45" width="90" height="90" rx="18" fill="#0B1330" stroke="url(#chipGrad)" stroke-width="2.4"/>
      <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round">
        <line x1="-14" y1="-45" x2="-14" y2="-54"/>
        <line x1="14" y1="-45" x2="14" y2="-54"/>
        <line x1="-14" y1="45" x2="-14" y2="54"/>
        <line x1="14" y1="45" x2="14" y2="54"/>
        <line x1="-45" y1="-14" x2="-54" y2="-14"/>
        <line x1="-45" y1="14" x2="-54" y2="14"/>
        <line x1="45" y1="-14" x2="54" y2="-14"/>
        <line x1="45" y1="14" x2="54" y2="14"/>
      </g>
      <text x="0" y="9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">AI</text>
    </g>
  </g>
</svg>
