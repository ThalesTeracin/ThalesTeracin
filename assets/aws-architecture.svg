<text x="48" y="50" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="26" font-weight="700">AWS Cloud Architecture</text>
<text x="48" y="78" fill="#93C5FD" font-family="Segoe UI,Arial" font-size="14">Exemplo de arquitetura moderna: entrada, processamento, dados, armazenamento e observabilidade.</text>
